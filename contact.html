<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تماس با ما | ELARO</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body data-base="../"><header id="site-header"></header><main><section class="page-hero"><div class="container"><h1>ارتباط با الارو</h1><p>برای دریافت راهنمایی با ما در تماس باشید</p></div></section><section class="content-section"><div class="container split"><div><h2>اطلاعات تماس</h2><p>تلفن: ۰۲۱-۰۰۰۰۰۰۰۰</p><p>آدرس: آدرس نمونه کلینیک – قابل ویرایش</p><p>ساعات کاری: شنبه تا پنج‌شنبه، ۹ تا ۱۷</p><p class="notice">اطلاعات بالا نمونه هستند؛ پیش از انتشار با اطلاعات واقعی جایگزین شوند.</p></div><form class="form-card" id="contact-form"><h2>ارسال پیام</h2><div class="field"><label for="contact-name">نام</label><input id="contact-name" required minlength="2"></div><div class="field"><label for="contact-phone">شماره موبایل</label><input id="contact-phone" required inputmode="tel"></div><div class="field"><label for="contact-message">پیام</label><textarea id="contact-message" rows="4" required></textarea></div><button class="btn">ارسال پیام آزمایشی</button><div id="contact-result"></div></form></div></section></main><footer id="site-footer"></footer><div id="toast"></div><script src="../js/storage.js"></script><script src="../js/main.js"></script><script>document.getElementById('contact-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('contact-result').innerHTML='<p class="success">فرم در نسخه نمایشی بررسی شد؛ پیام به سرور ارسال نشده است.</p>';e.target.reset();});</script></body></html>
